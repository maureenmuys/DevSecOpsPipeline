name: CI - Code kwaliteit & tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code kwaliteit valideren
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Java 17 instellen
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Java versie controleren
        run: java -version

      - name: Checkstyle — code stijl controleren
        run: mvn checkstyle:check --no-transfer-progress

      - name: Maven build & unit tests
        run: mvn test --no-transfer-progress

      - name: SpotBugs — bug detectie
        run: mvn spotbugs:check --no-transfer-progress

      - name: JaCoCo — coverage rapport genereren
        run: mvn jacoco:report --no-transfer-progress

      - name: Coverage rapport publiceren
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-rapport
          path: target/site/jacoco/

      - name: Test resultaten publiceren
        uses: actions/upload-artifact@v4
        with:
          name: test-resultaten
          path: target/surefire-reports/
        if: always()

      - name: Jenkins triggeren
        if: github.ref == 'refs/heads/main' && success()
        run: |
          curl -v -X POST \
            "https://jenkins-maureenmuys-dev.apps.rm3.7wse.p1.openshiftapps.com/job/poc-deploy/build?token=poc-deploy-token" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}"

name: CI - Code kwaliteit & tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code kwaliteit valideren
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Java 17 instellen
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle — code stijl controleren
        run: mvn checkstyle:check --no-transfer-progress
        # Pipeline stopt hier als code stijl niet klopt

      - name: Maven build & unit tests
        run: mvn test --no-transfer-progress
        # Pipeline stopt hier als tests falen

      - name: SpotBugs — bug detectie
        run: mvn spotbugs:check --no-transfer-progress
        # Pipeline stopt hier als bugs gevonden worden

      - name: JaCoCo — coverage rapport genereren
        run: mvn jacoco:report --no-transfer-progress

      - name: Coverage rapport publiceren
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-rapport
          path: target/site/jacoco/
        # Rapport downloadbaar in GitHub Actions tab

      - name: Test resultaten publiceren
        uses: actions/upload-artifact@v4
        with:
          name: test-resultaten
          path: target/surefire-reports/
        if: always()
        # Altijd uploaden, ook bij falen

      - name: Jenkins triggeren (alleen main branch)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          curl -X POST \
            "https://jenkins-maureenmuys-dev.apps.rm3.7wse.p1.openshiftapps.com/job/poc-deploy/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "GIT_COMMIT=${{ github.sha }}" \
            --data-urlencode "BRANCH=${{ github.ref_name }}"
        # Alleen naar Jenkins als alle checks slagen én op main branch
